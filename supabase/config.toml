# Fixed project name so local container/volume names (supabase_*_CR_DataEntry) don't
# depend on the directory the CLI is run from.
project_id = "CR_DataEntry"

[studio]
enabled = false

[analytics]
enabled = false

[functions.send_Res_CR_history_email]
enabled = true
verify_jwt = false
import_map = "./functions/send_Res_CR_history_email/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send_Res_CR_history_email/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send_Res_CR_history_email/*.html" ]
