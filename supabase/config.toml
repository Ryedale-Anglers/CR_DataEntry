# Fixed project name so local container/volume names (supabase_*_CR_DataEntry) don't
# depend on the directory the CLI is run from.
project_id = "CR_DataEntry"

[studio]
enabled = false

[analytics]
enabled = false

# Local sign-in settings for secretary.html. Production auth settings are made in
# the Supabase dashboard, not from this file.
[auth]
site_url = "http://localhost:8000/secretary.html"
additional_redirect_urls = ["http://localhost:8000/secretary.html", "http://127.0.0.1:8000/secretary.html"]
# Invite-only: accounts are created by invitation, never by public sign-up.
enable_signup = false
# Also enforced by secretary.html, but this is the rule that counts.
minimum_password_length = 12

[auth.email]
# Changing a password needs a code emailed to the account's address.
secure_password_change = true

[functions.send_catch_return_reminders]
enabled = true
# The function checks the caller itself with Supabase Auth, then against the
# secretary access list. That works with both the legacy and the new API keys.
verify_jwt = false
import_map = "./functions/send_catch_return_reminders/deno.json"
entrypoint = "./functions/send_catch_return_reminders/index.ts"

[functions.send_Res_CR_history_email]
enabled = true
verify_jwt = false
import_map = "./functions/send_Res_CR_history_email/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send_Res_CR_history_email/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send_Res_CR_history_email/*.html" ]
