name: Nightly ETL Job

on:
  schedule:
    # This runs at 02:17 London time daily
    - cron: '17 2 * * *'
      timezone: 'Europe/London'
  workflow_dispatch:
    inputs:
      full_season:
        description: 'Reconcile the whole season instead of the last 10 days'
        type: boolean
        default: false

jobs:
  run-etl:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Change '3.10' to '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Reservations only: catch returns are entered directly through
      # index.html. Reconciles reservations against the ibookfishing download
      # (never truncates) and fails the run if the download looks wrong.
      - name: Run ETL Script
        env:
          # This maps the GitHub Secret to an Environment Variable the script can see
          CLOUD_DB_URL: ${{ secrets.CLOUD_DB_URL }}
          IBOOKFISHING_REPORT_PAGE_URL: ${{ secrets.IBOOKFISHING_REPORT_PAGE_URL }}
          IBOOKFISHING_REPORT_SHSEC: ${{ secrets.IBOOKFISHING_REPORT_SHSEC }}
          IBOOKFISHING_REPORT_CALENDAR_ID: ${{ secrets.IBOOKFISHING_REPORT_CALENDAR_ID }}
          IBOOKFISHING_REPORT_S2: ${{ secrets.IBOOKFISHING_REPORT_S2 }}
          # Empty on scheduled runs, so they use the 10-day window
          ETL_FULL_SEASON: ${{ inputs.full_season }}
        run: python etl_reservations_only_to_supabase.py